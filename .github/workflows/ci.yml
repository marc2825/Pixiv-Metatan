name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, Chrome/Edge MV3 builds (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:edge
      - name: Manifest permissions guard
        run: npm run check:manifest

  # Synthetic browser suites (no real pixiv traffic). Not yet observed on GitHub-hosted runners,
  # so keep this job out of required status checks until it has proven stable there.
  browser:
    name: Playwright synthetic UI and production MV3 suites
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:extension
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-mv3-report
          path: .verification/extension-report.json
          if-no-files-found: ignore
          retention-days: 14
